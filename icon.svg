<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="globeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#ee5253"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- 背景角丸スクワークル -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- 地球儀の輪郭・サークル -->
  <circle cx="256" cy="256" r="160" fill="url(#globeGrad)" filter="url(#shadow)" opacity="0.9"/>
  <!-- 経緯度グリッド線 -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="6"/>
  <ellipse cx="256" cy="256" rx="90" ry="160" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="5"/>
  <line x1="96" y1="256" x2="416" y2="256" stroke="rgba(255,255,255,0.25)" stroke-width="5"/>

  <!-- マップピン -->
  <g filter="url(#shadow)">
    <path d="M256 120 C206 120 166 160 166 210 C166 280 256 376 256 376 C256 376 346 280 346 210 C346 160 306 120 256 120 Z" fill="url(#pinGrad)"/>
    <!-- ピン中央の時計アイコン -->
    <circle cx="256" cy="210" r="38" fill="#ffffff"/>
    <circle cx="256" cy="210" r="32" fill="#1e293b"/>
    <!-- 針 -->
    <line x1="256" y1="210" x2="256" y2="188" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <line x1="256" y1="210" x2="274" y2="210" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <line x1="256" y1="210" x2="242" y2="224" stroke="#ff4757" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="256" cy="210" r="4" fill="#ff4757"/>
  </g>
</svg>
